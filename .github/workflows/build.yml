name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install wxWidgets
        run: brew install wxwidgets

      - name: Configure
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j4

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # cmake's "Visual Studio 17 2022" generator relies on vswhere to
      # locate an installed VS instance, which was failing outright on this
      # runner image ("could not find any instance of Visual Studio") even
      # though VS2022 is preinstalled. Sidestepping that lookup entirely:
      # ilammy/msvc-dev-cmd loads the MSVC dev environment directly (like a
      # Developer Command Prompt), and NMake Makefiles just uses cl.exe from
      # PATH instead of asking cmake to find a VS instance on its own.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # wxWidgets 3.3 has no ready-made Windows package -- vcpkg builds it
      # from source, which is slow (10-20 min), so its compiled output is
      # cached across runs. VCPKG_INSTALLATION_ROOT is preinstalled on
      # windows-latest runners.
      - name: Point vcpkg's binary cache at a workspace-relative path
        shell: pwsh
        run: |
          $cacheDir = "$env:GITHUB_WORKSPACE\vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          # Pinned to a fixed suffix (bump it if the vcpkg triplet/wx version
          # changes) rather than hashing this whole file, so an unrelated
          # edit elsewhere in the workflow doesn't force a wxWidgets rebuild.
          key: vcpkg-windows-wxwidgets-v1
          restore-keys: |
            vcpkg-windows-wxwidgets-

      - name: Install wxWidgets via vcpkg
        shell: pwsh
        run: vcpkg install wxwidgets:x64-windows

      - name: Configure
        shell: cmd
        run: >
          cmake -S src -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: cmd
        run: cmake --build build
